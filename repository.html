<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelfTrack | Repository</title>
    <style>
        /* Shared Styles */
        :root {
            --primary: #2ea44f;
            --primary-hover: #2c974b;
            --bg-color: #0d1117;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }
        body { margin: 0; font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        header { text-align: center; padding: 80px 20px 40px; border-bottom: 1px solid var(--border-color); background-color: #010409; }
        h1 { font-size: 3.5rem; margin: 0 0 10px; color: #ffffff; letter-spacing: -1px; }
        .subtitle { font-size: 1.5rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 30px; }
        nav { margin-top: 30px; }
        nav a { color: var(--text-main); text-decoration: none; margin: 0 15px; font-size: 1.1rem; font-weight: 600; transition: color 0.2s; }
        nav a:hover, nav a.active { color: var(--primary); }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; min-height: 50vh; }
        .section { padding: 80px 0 100px; text-align: center; }
        .section-title { text-align: center; color: #ffffff; font-size: 2.2rem; margin-top: 0; margin-bottom: 30px; }
        footer { text-align: center; padding: 40px 20px; color: var(--text-muted); border-top: 1px solid var(--border-color); background-color: #010409; }
        
        /* Button Styles */
        .btn { display: inline-block; background-color: var(--primary); color: #ffffff; padding: 14px 28px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 1.1rem; transition: background-color 0.2s; }
        .btn:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>

    <header>
        <h1>ShelfTrack</h1>
        <p class="subtitle">Smart Pantry Inventory System</p>
        <nav>
            <a href="index.html">Team</a>
            <a href="mission.html">Mission</a>
            <a href="repository.html" class="active">Repository</a>
        </nav>
    </header>

    <div class="container">
        <section class="section">
            <h2 class="section-title">Explore the Code</h2>
            <p style="color: var(--text-muted); margin-bottom: 40px; font-size: 1.2rem;">Access our project resources and source code on GitHub.</p>
            <a href="https://github.com/YOUR_USERNAME/ShelfTrack" class="btn">View Repository</a>
        </section>
    </div>

    <footer>
        <p>Built for Stevens Institute of Technology Senior Design.</p>
    </footer>

</body>
</html>
