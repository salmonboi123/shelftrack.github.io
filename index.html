<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelfTrack | Smart Pantry Inventory System</title>
    <style>
        :root {
            --primary: #2ea44f;
            --primary-hover: #2c974b;
            --bg-color: #0d1117;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --card-bg: #161b22;
            --border-color: #30363d;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 80px 20px 40px;
            border-bottom: 1px solid var(--border-color);
            background-color: #010409;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0 0 10px;
            color: #ffffff;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.5rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 30px;
        }

        nav {
            margin-top: 30px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            margin: 0 15px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--primary);
        }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: #ffffff;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section {
            padding: 80px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            text-align: center;
            color: #ffffff;
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 50px;
        }

        /* Mission Section */
        .mission-content {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            font-size: 1.2rem;
            color: #ffffff;
        }

        /* Team Grid Layout */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .team-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
        }

        .avatar-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #30363d;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            overflow: hidden;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .team-card h3 {
            color: #ffffff;
            margin: 0 0 5px;
            font-size: 1.4rem;
        }

        .team-card .role {
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }
